<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Ccircle cx='180' cy='67' r='25' fill='%23F3A340'/%3E%3Cpath d='M28 181L98 64Q106 51 115 66L159 137L178 108Q186 96 194 110L232 180Q241 196 223 196H37Q19 196 28 181Z' fill='%23234D68'/%3E%3C/svg%3E" />
    <title>行迹 · 旅游规划</title>
  </head>
  <body>
    <script>
      // 首屏前确定主题，避免深色用户看到白屏闪烁。
      (function () {
        try {
          var mode = localStorage.getItem("tp-theme") || "system";
          var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themeMode = mode;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
